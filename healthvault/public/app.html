<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>健康幣 — 消費者 App</title>
<style>
:root{--teal:#0f766e;--teal-d:#0b5b54;--bg:#eef3f0;--card:#fff;--ink:#1f2d2a;--muted:#6b7c76;--red:#b91c1c;--gold:#b45309}
*{box-sizing:border-box}
body{font-family:system-ui,"Microsoft JhengHei",sans-serif;background:var(--bg);margin:0;color:var(--ink)}
header{background:var(--teal);color:#fff;padding:14px 18px;display:flex;align-items:center;gap:10px}
header h1{font-size:18px;margin:0}
.wrap{max-width:520px;margin:0 auto;padding:16px}
.card{background:var(--card);border-radius:16px;box-shadow:0 8px 24px rgba(15,118,110,.12);padding:18px;margin-bottom:14px}
.wallet{background:linear-gradient(135deg,var(--teal),var(--teal-d));color:#fff}
.wallet .bal{font-size:44px;font-weight:800;line-height:1.1}
.wallet .bal small{font-size:16px;font-weight:600;opacity:.9}
.row{display:flex;gap:8px;align-items:center}
.row.sb{justify-content:space-between}
.muted{color:var(--muted);font-size:13px}
.pill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700}
.pill.active{background:#d1fae5;color:#065f46}.pill.hold{background:#fee2e2;color:#991b1b}
label{display:block;font-size:13px;color:var(--muted);margin:8px 0 4px}
input{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:10px;font-size:15px}
button{border:0;border-radius:10px;padding:11px 14px;font-size:15px;font-weight:700;cursor:pointer}
.btn{background:var(--teal);color:#fff}.btn.ghost{background:#e8f0ec;color:var(--teal-d)}.btn.warn{background:#fde68a;color:#7c2d12}.btn.danger{background:#fecaca;color:#7f1d1d}
.barcode{display:flex;gap:1px;height:54px;align-items:stretch;margin:10px 0 4px;background:#fff;padding:8px;border-radius:8px}
.barcode i{display:block;background:#0b3d39}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;letter-spacing:1px;word-break:break-all}
.led{border-top:1px solid #eef1f0;padding:9px 0;display:flex;justify-content:space-between;align-items:center;font-size:14px}
.led .amt{font-weight:800}.amt.plus{color:var(--teal)}.amt.minus{color:var(--gold)}
.msg{margin-top:8px;font-size:14px;min-height:18px}.msg.err{color:var(--red)}.msg.ok{color:var(--teal)}
h3{margin:2px 0 8px;font-size:15px}
.alert{background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;padding:8px 10px;margin-top:8px;font-size:13px;color:#7c2d12}
.hide{display:none}
</style>
</head>
<body>
<header>
  <span style="font-size:22px">📱</span>
  <h1>健康幣 · 消費者 App</h1>
</header>
<div class="wrap">

  <div class="card" id="loginCard">
    <h3>登入錢包</h3>
    <p class="muted">貼上你的錢包 walletId（由發卡管理端發給；或先到管理端註冊）。</p>
    <label>錢包 walletId</label>
    <input id="walletInput" placeholder="例如 3f9c…（UUID）">
    <div class="row" style="margin-top:10px">
      <button class="btn" id="loginBtn" style="flex:1">開啟錢包</button>
    </div>
    <div class="msg err" id="loginMsg"></div>
  </div>

  <div id="main" class="hide">
    <div class="card wallet">
      <div class="row sb">
        <div><div class="muted" style="color:#d1fae5" id="nameLbl">—</div></div>
        <span class="pill active" id="statusPill">active</span>
      </div>
      <div class="bal"><span id="balVal">0</span> <small id="unitLbl">健康幣</small></div>
      <div class="muted" style="color:#d1fae5;margin-top:4px" id="todayLbl"></div>
      <div class="barcode" id="barcode"></div>
      <div class="code" id="walletCode"></div>
      <div class="muted" style="color:#d1fae5">出示此條碼／walletId 至特約店核銷</div>
    </div>

    <div class="card">
      <h3>🚶 走路賺幣（模擬同步）</h3>
      <p class="muted">輸入今日累計步數；有配戴心率裝置可填平均心率，達有氧區間享加權。</p>
      <div class="row">
        <div style="flex:1"><label>今日累計步數</label><input id="steps" type="number" value="8500"></div>
        <div style="flex:1"><label>平均心率（選填）</label><input id="hr" type="number" placeholder="例如 130"></div>
      </div>
      <button class="btn" id="syncBtn" style="width:100%;margin-top:10px">同步並發幣</button>
      <div class="msg" id="syncMsg"></div>
    </div>

    <div class="card">
      <div class="row sb"><h3>📜 交易明細</h3><button class="btn ghost" id="reloadBtn">重新整理</button></div>
      <div id="ledger"></div>
    </div>

    <div class="card">
      <h3>🛡️ 安心防禦（家屬）</h3>
      <p class="muted">卡片遺失或遭盜用時，一鍵凍結帳戶，資產立即鎖定。</p>
      <div class="row">
        <button class="btn danger" id="freezeBtn" style="flex:1">🔒 一鍵凍結（掛失）</button>
        <button class="btn ghost" id="unfreezeBtn" style="flex:1">🔓 解除凍結</button>
      </div>
      <div class="msg" id="guardMsg"></div>
      <div id="alerts"></div>
    </div>
  </div>
</div>

<script>
const $ = (s) => document.querySelector(s);
let WALLET = null, CFG = {};

async function api(method, path, body) {
  const opt = { method, headers: {} };
  if (body) { opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(body); }
  const r = await fetch(path, opt);
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || data.message || ('HTTP ' + r.status));
  return data;
}

function makeBarcode(text) {
  const el = $('#barcode'); el.innerHTML = '';
  for (let i = 0; i < text.length; i++) {
    const w = 1 + (text.charCodeAt(i) % 4);
    const bar = document.createElement('i');
    bar.style.width = w + 'px';
    bar.style.opacity = (i % 2 === 0) ? '1' : '0.25';
    el.appendChild(bar);
  }
}

function renderCard(w) {
  $('#nameLbl').textContent = w.name || '健康幣會員';
  $('#balVal').textContent = w.balance;
  $('#unitLbl').textContent = w.coinUnit || '健康幣';
  const pill = $('#statusPill');
  pill.textContent = w.status;
  pill.className = 'pill ' + (w.frozen ? 'hold' : 'active');
  $('#todayLbl').textContent = `今日 +${w.today.earned} / -${w.today.spent} · 步數 ${w.today.steps}（上限 發 ${w.caps.dailyEarn}／用 ${w.caps.dailySpend}）`;
  $('#walletCode').textContent = w.walletId;
  makeBarcode(w.walletId);
}

function renderLedger(list) {
  const box = $('#ledger');
  if (!list.length) { box.innerHTML = '<p class="muted">尚無交易。</p>'; return; }
  box.innerHTML = list.map((e) => {
    const plus = e.coins >= 0;
    const when = (e.when || '').replace('T', ' ').slice(0, 16);
    return `<div class="led"><div><div>${e.note || (plus ? '發幣' : '核銷')}</div><div class="muted">${when}</div></div>`
      + `<div class="amt ${plus ? 'plus' : 'minus'}">${plus ? '+' : ''}${e.coins}</div></div>`;
  }).join('');
}

async function refresh() {
  const w = await api('GET', '/api/wallet/' + WALLET);
  renderCard(w);
  renderLedger(w.recent);
  const alerts = await api('GET', '/api/wallet/' + WALLET + '/alerts');
  $('#alerts').innerHTML = alerts.slice(0, 5).map((a) => `<div class="alert">⚠ ${a.message}<div class="muted">${(a.at || '').replace('T', ' ').slice(0, 16)}</div></div>`).join('');
}

async function openWallet(id) {
  try {
    WALLET = id.trim();
    await refresh();
    localStorage.setItem('hv_wallet', WALLET);
    $('#loginCard').classList.add('hide');
    $('#main').classList.remove('hide');
  } catch (e) {
    $('#loginMsg').textContent = '開啟失敗：' + e.message;
  }
}

function setMsg(sel, text, kind) { const el = $(sel); el.textContent = text; el.className = 'msg ' + (kind || ''); }

async function init() {
  try { CFG = await api('GET', '/api/config'); } catch (e) { /* ignore */ }
  $('#loginBtn').addEventListener('click', () => openWallet($('#walletInput').value));
  $('#walletInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') openWallet($('#walletInput').value); });
  $('#reloadBtn').addEventListener('click', refresh);

  $('#syncBtn').addEventListener('click', async () => {
    setMsg('#syncMsg', '同步中…');
    try {
      const body = { walletId: WALLET, steps: Number($('#steps').value) };
      const hr = $('#hr').value; if (hr) body.heartRate = Number(hr);
      const r = await api('POST', '/api/engine/sync', body);
      setMsg('#syncMsg', r.message + (r.aerobic ? '（有氧加權 ×' + CFG.aerobicWeight + '）' : ''), 'ok');
      await refresh();
    } catch (e) { setMsg('#syncMsg', '同步失敗：' + e.message, 'err'); }
  });

  $('#freezeBtn').addEventListener('click', async () => {
    try { await api('POST', '/api/wallet/' + WALLET + '/freeze', { reason: '家屬掛失凍結' }); setMsg('#guardMsg', '已凍結，資產鎖定。', 'ok'); await refresh(); }
    catch (e) { setMsg('#guardMsg', e.message, 'err'); }
  });
  $('#unfreezeBtn').addEventListener('click', async () => {
    try { await api('POST', '/api/wallet/' + WALLET + '/unfreeze'); setMsg('#guardMsg', '已解除凍結。', 'ok'); await refresh(); }
    catch (e) { setMsg('#guardMsg', e.message, 'err'); }
  });

  const saved = localStorage.getItem('hv_wallet');
  if (saved) { $('#walletInput').value = saved; openWallet(saved); }
}
init();
</script>
</body>
</html>
